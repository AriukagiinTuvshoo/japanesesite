name: Phase 2 data foundation QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feat/v8-japanese-data-foundation]
permissions:
  contents: read
jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile scripts/jlpt_data_pipeline.py scripts/import_supabase.py qa/phase2_data_foundation_test.py
      - name: Phase 2 data contracts
        run: python qa/phase2_data_foundation_test.py
      - name: JavaScript syntax
        run: |
          for f in data-repositories.js api/content.js learning-engine.js ai-context.js ai-actions.js; do
            node --check "$f"
          done
      - name: Migration contract
        run: |
          grep -RIn "enable row level security" supabase/migrations
          grep -RIn "pending_review" supabase/migrations
          grep -RIn "create or replace function public.search_vocabulary" supabase/migrations
          grep -RIn "create or replace function public.search_kanji" supabase/migrations
      - name: Secret scan
        run: |
          if grep -RInE --exclude-dir=.git --exclude='PHASE3_5_QA.md' '(SUPABASE_SERVICE_ROLE_KEY=|AI_API_KEY=|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' .; then
            echo "Potential credential material found"
            exit 1
          fi
